name: Deploy to AWS Amplify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: amplify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Notify deployment triggered
        run: |
          echo "Push to main detected."
          echo "AWS Amplify auto-build is enabled and will deploy automatically."
          echo "Track progress at: https://us-east-1.console.aws.amazon.com/amplify/apps/d2kpc9u15a8ep1"
