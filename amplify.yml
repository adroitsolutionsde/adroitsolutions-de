version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "No pre-build steps required"
    build:
      commands:
        - echo "Static site - no build step required"
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  customHeaders:
    - pattern: '/*'
      headers:
        - key: Strict-Transport-Security
          value: 'max-age=31536000; includeSubDomains; preload'
        - key: X-Content-Type-Options
          value: 'nosniff'
        - key: X-Frame-Options
          value: 'DENY'
        - key: Referrer-Policy
          value: 'strict-origin-when-cross-origin'
        - key: X-XSS-Protection
          value: '1; mode=block'
        - key: Permissions-Policy
          value: 'camera=(), microphone=(), geolocation=()'
        - key: Content-Security-Policy
          value: "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
