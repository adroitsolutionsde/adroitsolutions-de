AWSTemplateFormatVersion: '2010-09-09'
Description: >
  WAF v2 WebACL for adroitsolutions.de — associates with CloudFront (CLOUDFRONT scope).
  Includes AWS Managed Rule Groups for OWASP core, known bad inputs, IP reputation,
  and a rate-limiting rule at 2000 requests per 5 minutes per IP.

  Deploy to us-east-1 (required for CLOUDFRONT scope):
    aws cloudformation deploy \
      --template-file infra/waf-webacl.yml \
      --stack-name adroit-waf \
      --region us-east-1 \
      --capabilities CAPABILITY_NAMED_IAM

  After deploy, copy the WebACLArn output and associate it with your
  CloudFront distribution (or Amplify custom domain distribution) either
  via the CloudFront console → Security → AWS WAF, or add it to a
  CloudFormation stack that manages the distribution.

Parameters:
  RateLimitThreshold:
    Type: Number
    Default: 2000
    Description: Maximum requests per IP per 5-minute window before blocking.

Resources:
  AdroitWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: adroit-solutions-webacl
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: AdroitWebACL
      Rules:

        # 1. Core OWASP protection (priority 10)
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 10
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSet
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet

        # 2. Log4j / path traversal (priority 20)
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 20
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputs
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet

        # 3. Amazon IP reputation list — block known bad-actor IPs (priority 30)
        - Name: AWSManagedRulesAmazonIpReputationList
          Priority: 30
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: IpReputationList
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList

        # 4. Rate limiting: 2000 req / 5 min per IP (priority 1 — evaluated first)
        - Name: RateLimitPerIP
          Priority: 1
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPerIP
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitThreshold
              AggregateKeyType: IP

Outputs:
  WebACLArn:
    Description: >
      ARN of the WAF WebACL. Associate this with your CloudFront distribution
      under Security → AWS WAF in the CloudFront console.
    Value: !GetAtt AdroitWebACL.Arn
    Export:
      Name: AdroitWebACLArn

  WebACLId:
    Description: WAF WebACL ID (needed for some CLI association commands).
    Value: !GetAtt AdroitWebACL.Id
